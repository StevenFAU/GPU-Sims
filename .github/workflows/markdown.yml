name: Markdown

on:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - '.github/workflows/markdown.yml'
  pull_request:
    paths:
      - '**/*.md'
      - '.github/workflows/markdown.yml'

permissions:
  contents: read

jobs:
  lint:
    name: Lint markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: |
            **/*.md
            !node_modules
            !**/build
            !**/dist

  link-check:
    name: Check internal links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links
        uses: lycheeverse/lychee-action@v1
        with:
          args: >-
            --offline
            --no-progress
            --include-fragments
            --exclude-path node_modules
            --exclude-path build
            --exclude-path dist
            --exclude-path docs/sim-specs/_template.md
            './**/*.md'
          fail: true
