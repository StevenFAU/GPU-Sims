[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gpusims-mpm-multimaterial-py"
version = "0.1.0"
description = "MLS-MPM multi-material (water + jelly + snow) using Taichi"
requires-python = ">=3.11"
dependencies = [
    "gpusims-common-py @ file://../../../common/common-py",
    "taichi>=1.7.4,<1.8",
    "numpy>=1.26,<3",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6,<1.0",
    "mypy>=1.11,<2",
    "pytest>=8,<9",
]

[tool.setuptools]
py-modules = ["main", "kernels", "presets"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "PIE", "RUF"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
[[tool.mypy.overrides]]
module = ["taichi.*", "pyopenvdb.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
